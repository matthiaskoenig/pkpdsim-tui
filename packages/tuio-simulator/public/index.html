<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="The control surface of the TUIO 2.0 simulator of pkpdsim-tui: tokens and touches on a table, sent to a table application as TUIO 2.0 bundles.">
  <title>TUIO 2.0 simulator | pkpdsim-tui</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%23007c78'/%3E%3Ccircle%20cx='12'%20cy='13'%20r='5'%20fill='none'%20stroke='white'%20stroke-width='2'/%3E%3Ccircle%20cx='22'%20cy='22'%20r='3'%20fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="bar">
    <h1>TUIO 2.0 simulator</h1>
    <div class="status" id="status" data-state="connecting">
      <span class="dot"></span>
      <span id="status-text">Connecting to the simulator...</span>
    </div>
    <div class="fields">
      <label for="marker">Next marker
        <input id="marker" type="number" min="0" max="999" step="1" value="1" inputmode="numeric">
      </label>
      <label for="width">Surface
        <input id="width" type="number" min="1" max="65535" step="1" value="1920" inputmode="numeric" aria-label="The width of the surface in pixels">
        <span class="times">&times;</span>
        <input id="height" type="number" min="1" max="65535" step="1" value="1080" inputmode="numeric" aria-label="The height of the surface in pixels">
        <span class="unit">px</span>
      </label>
      <button id="clear" type="button">Clear surface</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg id="table" class="table" role="application" aria-label="The surface of the table">
      <g id="pointers"></g>
      <g id="tokens"></g>
    </svg>
  </main>

  <footer class="help">
    <ul class="gestures">
      <li><b>Drag</b> empty space is a touch</li>
      <li><b>Double click</b> places a token</li>
      <li><b>Drag</b> a token moves it</li>
      <li><b>Scroll</b> over a token turns it, with <b>shift</b> for finer steps</li>
      <li><b>Middle click</b> a token removes it</li>
    </ul>
    <p class="counts" id="counts"></p>
  </footer>

  <noscript>The control surface of the simulator needs JavaScript.</noscript>
  <script type="module" src="./control.mjs"></script>
</body>
</html>
