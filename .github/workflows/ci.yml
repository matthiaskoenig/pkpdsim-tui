name: ci

on:
  push:
    # feature branches are built through their pull request, a tag releases
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install the locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        # the exported models are not in the repository, so the bundle is built
        # without them; the application loads them at run time
        run: npm run build

  windows:
    name: windows
    # A table is set up on Windows as well, and the one thing which cannot be the same there is
    # how a command of a package is started: the shims of `node_modules/.bin` are no programs
    # under their plain name, which is what issue #21 was. The checks of `node` run here again
    # rather than only on Linux, so the next one of those is seen before a table is unpacked.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install the locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        # the exported models are not in the repository, so the bundle is built
        # without them; the application loads them at run time
        run: npm run build

  release:
    name: release
    # the release is made from the tree the checks passed on, see docs/development.md
    needs: node
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub release
        # the notes of the version are written before it is tagged, and a test
        # of the repository fails without them
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          body_path: "release-notes/${{ github.ref_name }}.md"
          draft: false
          prerelease: false

  sync-main:
    name: sync-main
    # main tracks the latest release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # a shallow clone cannot be pushed to another branch
          fetch-depth: 0
      - name: Fast-forward main to the release
        # the full ref name, because git cannot guess a destination which does not exist yet and
        # the first release of a repository is the one which creates the branch; no --force, so
        # the push fails loudly if it would not be a fast-forward
        run: git push origin HEAD:refs/heads/main
