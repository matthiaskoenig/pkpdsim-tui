# The documentation of this repository is built with Zensical, which is a python tool. The
# applications themselves are node, see package.json; nothing here is imported by them.
[project]
name = "pkpdsim-tui-docs"
version = "0.1.0"
description = "The documentation build of pkpdsim-tui."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]

[project.optional-dependencies]
dev = [
    "zensical>=0.1.3",
    # compiles an SBML model to the WebAssembly a table application runs, see
    # scripts/export_model.py. The same release that pkpdsim exports its own
    # examples with, so a model exported here and one exported there run on the
    # same runtime
    "sbmlsim-core>=0.13.0",
]

[tool.uv]
package = false
